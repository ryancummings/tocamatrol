; Tocamatrol dongle firmware. See ../protocol/PROTOCOL.md, ../boards.json, and ../README.md.
;
;   pio run -e t-dongle-s3            release build (HID only, ADR 0003)
;   pio run -e t-dongle-s3-debug      adds USB serial logging
;   pio test -e native                logic tests on this computer

[platformio]
default_envs = t-dongle-s3, xiao-esp32s3, devkitc-s3-n8, devkitc-s3

[esp32s3]
platform = espressif32@8.0.0
framework = arduino
lib_deps = h2zero/NimBLE-Arduino@2.5.2
monitor_speed = 115200
extra_scripts = post:scripts/merge_bin.py
; NimBLE limits (3 bonds, 3 connections) come from the core's precompiled sdkconfig.
; TinyUSB (USB-OTG) mode, so the native USB port is HID rather than the built-in serial/JTAG.
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    ; The core's USB library also compiles its mass-storage classes, which include FS.h
    ; without declaring FS as a dependency.
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
    -DARDUINO_USB_MODE=0
    -DFW_VERSION_MAJOR=1
    -DFW_VERSION_MINOR=0
    -DTOCA_PC_CHANNEL=0
release_flags =
    ${esp32s3.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DTOCA_DEBUG=0
; Debug build that logs on UART0, for boards with a separate USB-serial (COM) port.
uart_debug_flags =
    ${esp32s3.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DTOCA_DEBUG=1
; build_unflags also strips matching flags we add, so debug builds keep CDC_ON_BOOT=1.
debug_unflags = -DARDUINO_USB_MODE=1
debug_flags =
    ${esp32s3.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DTOCA_DEBUG=1

; LilyGO T-Dongle-S3: USB-A plug, 0.96" LCD (the status screen), APA102 RGB LED, BOOT button.
[env:t-dongle-s3]
extends = esp32s3
board = esp32-s3-devkitc-1
build_flags = ${esp32s3.release_flags} -DTOCA_BOARD_T_DONGLE_S3
; The status screen (src/status_display.cpp).
lib_deps =
    ${esp32s3.lib_deps}
    adafruit/Adafruit ST7735 and ST7789 Library@1.10.4
    adafruit/Adafruit GFX Library@1.11.11

[env:t-dongle-s3-debug]
extends = env:t-dongle-s3
build_unflags = ${esp32s3.debug_unflags}
build_flags = ${esp32s3.debug_flags} -DTOCA_BOARD_T_DONGLE_S3

; Seeed XIAO ESP32-S3: USB-C, one user LED, BOOT button.
[env:xiao-esp32s3]
extends = esp32s3
board = seeed_xiao_esp32s3
build_flags = ${esp32s3.release_flags} -DTOCA_BOARD_XIAO_ESP32S3

[env:xiao-esp32s3-debug]
extends = env:xiao-esp32s3
build_unflags = ${esp32s3.debug_unflags}
build_flags = ${esp32s3.debug_flags} -DTOCA_BOARD_XIAO_ESP32S3

; ESP32-S3-DevKitC-1 N8 / N4 (without octal PSRAM): WS2812 LED, BOOT button, two USB-C ports.
; Flash through the COM/UART port; the PC uses the USB port.
[env:devkitc-s3-n8]
extends = esp32s3
board = esp32-s3-devkitc-1
build_flags = ${esp32s3.release_flags} -DTOCA_BOARD_DEVKITC_S3

[env:devkitc-s3-n8-debug]
extends = env:devkitc-s3-n8
build_flags = ${esp32s3.uart_debug_flags} -DTOCA_BOARD_DEVKITC_S3

; ESP32-S3-DevKitC-1 N16R8 / N8R8 (octal PSRAM): WS2812 LED, BOOT button, two USB-C ports.
; Flash through the COM/UART port; the PC uses the USB port.
; R8 modules have octal PSRAM: the default quad-PSRAM core build hangs before setup() on them.
[env:devkitc-s3]
extends = esp32s3
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_flags = ${esp32s3.release_flags} -DTOCA_BOARD_DEVKITC_S3

; Debug logs go to the COM port (UART0), so the USB port stays HID only and logs survive
; even if USB never starts.
[env:devkitc-s3-debug]
extends = env:devkitc-s3
build_flags = ${esp32s3.uart_debug_flags} -DTOCA_BOARD_DEVKITC_S3

; Host-side tests of lib/toca_core (no Arduino, no hardware).
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
